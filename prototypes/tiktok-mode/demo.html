<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPMH Prototype | TikTok Mode v8 (Dreamy Fade)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; margin: 0; overflow: hidden; }
        [x-cloak] { display: none !important; }
        
        .slide-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 1.2s ease-in-out;
            background: #000;
        }

        .fade-out { opacity: 0; pointer-events: none; }
        .fade-in { opacity: 1; pointer-events: auto; }

        .progress-bar {
            position: absolute;
            bottom: 0; left: 0; height: 6px; background: #dc2626;
            z-index: 100;
            box-shadow: 0 0 20px rgba(220, 38, 36, 0.5);
        }

        .btn-v8 {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-v8:hover { transform: scale(1.1); background: #dc2626; border-color: #dc2626; }
    </style>
</head>
<body x-data="tiktokEngine()">

    <!-- Initial Interaction Shield -->
    <div x-show="!hasInteracted" class="fixed inset-0 z-[2000] bg-[#050505] flex flex-col items-center justify-center space-y-10">
        <div class="text-center">
            <h1 class="text-6xl font-black uppercase tracking-tighter mb-2">TikTok Mode</h1>
            <p class="text-white/20 text-[10px] font-black uppercase tracking-[0.5em]">v8 Dreamy Fade Edition</p>
        </div>
        <button @click="startEngine()" class="px-16 py-8 bg-red-600 text-white rounded-full font-black uppercase tracking-widest text-xl shadow-2xl hover:scale-105 transition-all">
            START IMMERSION 🔊
        </button>
    </div>

    <!-- Main Container -->
    <div class="relative h-screen w-full overflow-hidden bg-black">
        
        <!-- Video Layer: Active -->
        <div class="slide-layer" :class="isTransitioning ? 'fade-out' : 'fade-in'">
            <video x-ref="mainVideo"
                   class="w-full h-full object-cover"
                   autoplay loop playsinline
                   :src="getVideoUrl(currentVideo?.id)"
                   @loadedmetadata="onVideoLoaded($el)"></video>
            
            <!-- Bottom Text Overlay -->
            <div class="absolute inset-x-0 bottom-0 p-16 bg-gradient-to-t from-black via-transparent to-transparent pointer-events-none">
                <div class="space-y-2">
                    <span class="text-red-600 font-black uppercase tracking-[0.3em] text-[10px]" x-text="isClimax ? 'CLIMAX ACTIVE 🥵' : 'NORMAL MODE 🥴'"></span>
                    <h1 class="text-6xl font-black uppercase tracking-tighter drop-shadow-2xl" x-text="currentVideo?.title"></h1>
                </div>
            </div>
        </div>

        <!-- Video Layer: Next (Hidden/Fading in) -->
        <div class="slide-layer" :class="isTransitioning ? 'fade-in' : 'fade-out'">
            <video x-ref="nextVideo"
                   class="w-full h-full object-cover"
                   muted loop playsinline
                   :src="getVideoUrl(nextVideo?.id)"></video>
        </div>

        <!-- Progress Timer -->
        <div class="progress-bar" :style="`width: ${ (timeLeft / maxTime) * 100 }%; transition: width 1s linear;` "></div>

        <!-- FIXED NAVIGATION -->
        
        <!-- Top Left: Exit -->
        <div class="absolute top-10 left-10 z-[200] flex items-center gap-6">
            <button @click="location.reload()" class="btn-v8 px-8 py-5 rounded-2xl flex items-center gap-4 font-black uppercase tracking-widest text-[12px] text-white shadow-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7 7-7"></path></svg>
                Back to SPMH
            </button>
            <div class="h-12 w-[1px] bg-white/20"></div>
            <div class="text-[12px] font-black uppercase tracking-[0.2em] text-white/40">
                SWAP: <span class="text-white" x-text="timeLeft + 's'"></span>
            </div>
        </div>

        <!-- Right Side Controls -->
        <div class="absolute right-10 bottom-32 flex flex-col items-center gap-10 z-[200]">
            
            <!-- Force Next -->
            <button @click="triggerTransition()" class="btn-v8 w-24 h-24 rounded-full flex items-center justify-center shadow-2xl group">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"></path></svg>
            </button>

            <!-- Mode Toggle -->
            <button @click="toggleClimax()" 
                    class="btn-v8 w-24 h-24 rounded-[40px] flex items-center justify-center text-5xl"
                    :class="isClimax ? 'bg-red-600 border-red-600' : ''">
                <span x-text="isClimax ? '🥴' : '🥵'"></span>
            </button>

            <!-- Volume -->
            <div class="flex flex-col items-center gap-8 py-10 px-6 btn-v8 rounded-full">
                <div class="h-40 w-3 bg-white/10 rounded-full relative overflow-hidden flex flex-col justify-end">
                    <div class="bg-red-600 w-full" :style="`height: ${volume * 100}%`"></div>
                    <input type="range" x-model="volume" min="0" max="1" step="0.05" @input="syncVolume()" class="absolute inset-0 opacity-0 cursor-pointer" orient="vertical">
                </div>
                <svg class="w-6 h-6 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            </div>
        </div>

    </div>

    <script>
        function tiktokEngine() {
            return {
                server: 'http://127.0.0.1:8888',
                testVideos: [
                    { id: '2db75058c64445f404d86657a5e2ef67', title: "The Revenant" },
                    { id: 'c8b19fb388dc7ab7dd0c557f1e830d54', title: "Interstellar" },
                    { id: '99a0ddd11c86b0f490bca16becb7146f', title: "O Corvo" },
                    { id: '9fc343fe2bf3aa15305a1c6aa59f7053', title: "Nightcrawler" },
                    { id: '21d79e64b00e7894d92cc52c7624f778', title: "Cyberpunk" }
                ],
                currentVideo: null,
                nextVideo: null,
                isClimax: false,
                isTransitioning: false,
                hasInteracted: false,
                timeLeft: 60,
                maxTime: 60,
                volume: 0.8,
                timerInterval: null,

                getVideoUrl(id) {
                    if(!id) return '';
                    return `${this.server}/api/stream/${id}?t=${Date.now()}`;
                },

                async startEngine() {
                    this.hasInteracted = true;
                    this.currentVideo = this.testVideos[Math.floor(Math.random() * this.testVideos.length)];
                    this.prepareNext();
                    this.startTimer();
                },

                startTimer() {
                    this.timeLeft = this.isClimax ? 20 : 60;
                    this.maxTime = this.timeLeft;
                    clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        if (this.timeLeft > 0) { this.timeLeft--; } 
                        else { this.triggerTransition(); }
                    }, 1000);
                },

                onVideoLoaded(el) {
                    el.currentTime = Math.random() * (el.duration * 0.8 || 1);
                    el.volume = this.volume;
                    el.play();
                },

                syncVolume() {
                    if(this.$refs.mainVideo) this.$refs.mainVideo.volume = this.volume;
                },

                prepareNext() {
                    let next;
                    do {
                        next = this.testVideos[Math.floor(Math.random() * this.testVideos.length)];
                    } while (next.id === this.currentVideo.id);
                    this.nextVideo = next;
                },

                triggerTransition() {
                    if(this.isTransitioning) return;
                    this.isTransitioning = true;
                    
                    // Fade duration matches CSS (1.2s)
                    setTimeout(() => {
                        this.currentVideo = this.nextVideo;
                        this.isTransitioning = false;
                        this.prepareNext();
                        this.startTimer();
                    }, 1200);
                },

                toggleClimax() {
                    this.isClimax = !this.isClimax;
                    this.startTimer();
                }
            }
        }
    </script>
</body>
</html>
