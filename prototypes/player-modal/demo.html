<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPMH Prototype | Elite Player v24 (Final Polish)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; }
        .hide-cursor { cursor: none !important; }
        [x-cloak] { display: none !important; }
        .ambilight { filter: blur(80px) brightness(0.4) saturate(1.5); opacity: 0.4; transition: all 1s ease; }
        
        .preview-fixed-center {
            width: 280px;
            aspect-ratio: 16/9;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 80px rgba(0,0,0,1);
            overflow: hidden;
            background: #000;
            position: absolute;
            left: 50%;
            bottom: 160px;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1000;
        }
        
        .preview-time-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            padding: 10px 0;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 900;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .timeline-container {
            height: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        
        .timeline-track {
            height: 8px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .timeline-fill {
            height: 100%;
            background: #dc2626;
            border-radius: 10px;
            position: absolute;
            top: 0;
            left: 0;
        }

        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.1); border-radius: 10px; height: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #dc2626; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body x-data="playerApp()" 
      class="overflow-hidden bg-black" 
      :class="(playing && !showControls && !paused) ? 'hide-cursor' : ''"
      @mousemove="handleGlobalMove($event)"
      @keydown.escape="closePlayer()">

    <div class="p-20 text-center" x-show="!playing">
        <h1 class="text-4xl font-black mb-10 tracking-tighter uppercase">Laboratório: Player Elite v24 (Final Polish)</h1>
        <button @click="openPlayer()" class="bg-red-600 px-12 py-5 rounded-2xl font-black uppercase tracking-widest hover:scale-105 transition-all">
            Testar Final Polish v24
        </button>
    </div>

    <template x-if="playing">
        <div id="player-portal" class="fixed inset-0 z-[9000] flex items-center justify-center p-0 md:p-12" x-transition.opacity.duration.400ms>
            
            <div class="absolute inset-0 z-0 overflow-hidden">
                <video x-ref="bgVideo" src="http://localhost:8888/api/stream/21d79e64b00e7894d92cc52c7624f778" muted loop class="w-full h-full object-cover ambilight scale-110"></video>
                <div class="absolute inset-0 bg-black/60"></div>
            </div>

            <div :class="isFullscreen ? 'w-screen h-screen rounded-none border-none' : 'relative w-full max-w-6xl aspect-video rounded-none md:rounded-[40px] border border-white/10 shadow-[0_0_100px_rgba(0,0,0,1)]'" 
                 class="relative z-10 bg-black overflow-hidden group flex flex-col transition-all duration-500 min-w-[300px] min-h-[150px]">
                
                <video x-ref="video" 
                       src="http://localhost:8888/api/stream/21d79e64b00e7894d92cc52c7624f778" 
                       class="w-full h-full object-contain"
                       @timeupdate="updateProgress()"
                       @click="togglePlay()"></video>

                <div class="absolute inset-0 z-30 flex flex-col justify-between opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"
                     :class="(showControls || paused || hoveringTimeline) ? 'opacity-100' : ''">
                    
                    <div x-show="hoveringTimeline" class="preview-fixed-center" x-cloak x-transition.opacity>
                        <video x-ref="previewVideo" src="http://localhost:8888/api/stream/21d79e64b00e7894d92cc52c7624f778" muted class="w-full h-full object-cover"></video>
                        <div class="preview-time-tag" x-text="formatTime(hoverTime)"></div>
                    </div>

                    <!-- Top Bar (Restored Find File) -->
                    <div class="p-8 flex justify-between items-center bg-gradient-to-b from-black/95 to-transparent pointer-events-auto">
                        <div class="flex items-center gap-6">
                            <button @click="closePlayer()" class="p-4 bg-white/5 hover:bg-red-600 rounded-full transition-all group/back">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                            </button>
                            <div>
                                <h2 class="text-xl font-black uppercase tracking-widest leading-none mb-1">O Corvo</h2>
                                <p class="text-[10px] text-white/40 font-bold uppercase tracking-widest">Final Polish Hub</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <button @click="openInExplorer()" class="px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all">Find File</button>
                            <button @click="toggleFullscreen()" class="p-4 bg-white/5 hover:bg-white/10 rounded-full transition-all">
                                <svg x-show="!isFullscreen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                                <svg x-show="isFullscreen" class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0h5M4 4v5m11 0V4m0 0h-5m5 0l-5 5m0 6l5 5m0 0h-5m5 0v-5m-6 0v5m0 0h5m-5 0l-5-5"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="p-10 bg-gradient-to-t from-black/95 to-transparent pointer-events-auto space-y-4 relative">
                        
                        <div class="timeline-container" 
                                @mousemove="handleTimelineMove($event)" 
                                @mouseleave="hoveringTimeline = false"
                                @click="seek($event)">
                            <div class="timeline-track">
                                <div class="timeline-fill" :style="`width: ${progress}%`"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-8">
                                <button @click="skip(-10)" class="text-white/60 hover:text-white transition-colors"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg></button>
                                <button @click="togglePlay()" class="text-white transition-transform hover:scale-110">
                                    <template x-if="paused"><svg class="w-12 h-12 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></template>
                                    <template x-if="!paused"><svg class="w-12 h-12 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></template>
                                </button>
                                <button @click="skip(10)" class="text-white/60 hover:text-white transition-colors rotate-180"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg></button>
                                
                                <!-- Fixed Mute Button -->
                                <div class="flex items-center gap-4 ml-4 group/vol">
                                    <button @click="toggleMute()" class="text-white/60 hover:text-white transition-colors">
                                        <svg x-show="!isMuted" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                                        <svg x-show="isMuted" class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
                                    </button>
                                    <input type="range" min="0" max="1" step="0.1" x-model="volume" @input="updateVolume()" class="w-20 opacity-0 group-hover/vol:opacity-100 transition-all cursor-pointer">
                                </div>
                            </div>

                            <div class="flex items-center gap-6" x-data="{ openTracks: false, openSpeed: false }">
                                <div class="relative">
                                    <button @click="openSpeed = !openSpeed" class="text-[10px] font-black uppercase tracking-widest px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl border border-white/10 transition-all" x-text="speed + 'x'"></button>
                                    <div x-show="openSpeed" @click.away="openSpeed = false" class="absolute bottom-full mb-4 left-0 bg-black/95 backdrop-blur-3xl border border-white/20 rounded-2xl p-2 w-20 shadow-2xl space-y-1" x-transition x-cloak>
                                        <template x-for="s in [0.5, 1, 1.5, 2]">
                                            <button @click="speed = s; $refs.video.playbackRate = s; openSpeed = false" class="w-full text-center py-2 text-[10px] font-bold rounded-lg hover:bg-red-600 transition-all" :class="speed === s ? 'bg-red-600' : ''" x-text="s + 'x'"></button>
                                        </template>
                                    </div>
                                </div>
                                <span class="font-mono text-xs text-white/40" x-text="formatTime(currentTime) + ' / ' + formatTime(duration)"></span>
                                <div class="relative">
                                    <button @click="openTracks = !openTracks" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest transition-all">Tracks</button>
                                    <div x-show="openTracks" @click.away="openTracks = false" class="absolute bottom-full mb-4 right-0 bg-black/95 backdrop-blur-3xl border border-white/20 rounded-2xl p-4 w-48 shadow-2xl space-y-3 text-left" x-transition x-cloak>
                                        <div><p class="text-[8px] font-black uppercase text-white/40 mb-2">Subtitles</p><button class="w-full text-left py-2 px-3 text-[10px] font-bold rounded-lg bg-red-600">Portuguese (Auto)</button></div>
                                        <div><p class="text-[8px] font-black uppercase text-white/40 mb-2">Audio</p><button class="w-full text-left py-2 px-3 text-[10px] font-bold rounded-lg hover:bg-white/10">Default Track</button></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        function playerApp() {
            return {
                playing: false, paused: true, progress: 0, currentTime: 0, duration: 0, volume: 0.8,
                isMuted: false, isFullscreen: false, showControls: true, speed: 1,
                hoveringTimeline: false, hoverTime: 0, lastUpdate: 0, lastVolume: 0.8,

                init() {
                    document.addEventListener('fullscreenchange', () => { this.isFullscreen = !!document.fullscreenElement; });
                },
                openPlayer() {
                    this.playing = true;
                    this.$nextTick(() => { this.$refs.video.play(); this.$refs.bgVideo.play(); this.paused = false; });
                },
                closePlayer() { this.playing = false; this.paused = true; if (document.fullscreenElement) document.exitFullscreen(); },
                togglePlay() {
                    const v = this.$refs.video; const bg = this.$refs.bgVideo;
                    if (v.paused) { v.play(); bg.play(); this.paused = false; }
                    else { v.pause(); bg.pause(); this.paused = true; }
                },
                skip(sec) { this.$refs.video.currentTime += sec; this.$refs.bgVideo.currentTime = this.$refs.video.currentTime; },
                updateProgress() {
                    const v = this.$refs.video;
                    if (v && !this.hoveringTimeline) {
                        this.currentTime = v.currentTime; this.duration = v.duration;
                        this.progress = (v.currentTime / v.duration) * 100;
                    }
                },
                handleTimelineMove(e) {
                    this.hoveringTimeline = true;
                    const rect = e.currentTarget.getBoundingClientRect();
                    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    this.hoverTime = ratio * this.duration;

                    const now = Date.now();
                    if (now - this.lastUpdate > 40) {
                        if (this.$refs.previewVideo) this.$refs.previewVideo.currentTime = this.hoverTime;
                        this.lastUpdate = now;
                    }
                },
                handleGlobalMove() {
                    this.showControls = true;
                    clearTimeout(this.controlsTimeout);
                    if (!this.paused) this.controlsTimeout = setTimeout(() => { this.showControls = false; }, 3000);
                },
                seek(e) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const ratio = (e.clientX - rect.left) / rect.width;
                    this.$refs.video.currentTime = ratio * this.duration;
                },
                toggleMute() {
                    this.isMuted = !this.isMuted;
                    if (this.isMuted) { this.lastVolume = this.volume; this.volume = 0; }
                    else { this.volume = this.lastVolume || 0.8; }
                    this.$refs.video.volume = this.volume;
                    this.$refs.video.muted = this.isMuted;
                },
                updateVolume() { this.$refs.video.volume = this.volume; this.isMuted = this.volume === 0; this.$refs.video.muted = this.isMuted; },
                toggleFullscreen() {
                    const el = document.getElementById('player-portal');
                    if (!document.fullscreenElement) el.requestFullscreen();
                    else document.exitFullscreen();
                },
                formatTime(sec) {
                    if (isNaN(sec)) return "00:00";
                    const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
                    return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
                },
                async openInExplorer() {
                    const id = '21d79e64b00e7894d92cc52c7624f778';
                    await fetch(`http://localhost:8888/api/open/${id}`, { method: 'POST' });
                }
            }
        }
    </script>
</body>
</html>
