<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPMH Prototype | Diagnostics HUD v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white p-20" x-data="hubApp()">

    <h1 class="text-4xl font-black mb-4">Laboratório: Diagnostics HUD v2</h1>
    <p class="text-white/40 mb-10 italic">"Se o motor não ronca, o HUD explica o porquê."</p>

    <!-- HUD COMPONENT START -->
    <div x-show="debugMode" 
         class="fixed top-10 left-10 p-8 bg-black/90 backdrop-blur-3xl border border-white/20 rounded-[40px] font-mono text-[11px] space-y-4 shadow-2xl z-[10000] w-96"
         x-transition.scale.origin.top.left
         x-cloak>
        
        <div class="flex items-center justify-between gap-10 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
                <span class="text-red-600 font-black uppercase tracking-tighter text-sm">Engine Telemetry</span>
            </div>
            <span class="text-white/20">PROTOTYPE</span>
        </div>

        <div class="space-y-3 text-white/80">
            <!-- Informações de Arquivo -->
            <div class="space-y-1 pb-2 border-b border-white/5">
                <div class="text-white/30 uppercase text-[9px]">Media Identification</div>
                <div class="flex justify-between"><span>ID:</span> <span class="text-white" x-text="diagData.id"></span></div>
                <div class="flex justify-between"><span>Format:</span> <span class="text-yellow-500 uppercase" x-text="diagData.format"></span></div>
                <div class="flex justify-between"><span>Resolution:</span> <span class="text-white" x-text="diagData.res"></span></div>
            </div>

            <!-- Estado da Rede e Navegador -->
            <div class="space-y-1 pb-2 border-b border-white/5">
                <div class="text-white/30 uppercase text-[9px]">Browser Pipeline</div>
                <div class="flex justify-between">
                    <span>Network State:</span> 
                    <span :class="diagData.netCode === 3 ? 'text-red-500' : 'text-green-500'" x-text="diagData.network"></span>
                </div>
                <div class="flex justify-between">
                    <span>Ready State:</span> 
                    <span class="text-blue-400" x-text="diagData.ready"></span>
                </div>
                <div x-show="diagData.error" class="flex justify-between text-red-500 font-bold uppercase">
                    <span>Panic Error:</span> 
                    <span x-text="diagData.error"></span>
                </div>
            </div>

            <!-- Streaming e Performance -->
            <div class="space-y-1">
                <div class="text-white/30 uppercase text-[9px]">Streaming Health</div>
                <div class="flex justify-between"><span>Buffer:</span> <span class="text-blue-400" x-text="diagData.buffer + 's / ' + diagData.duration + 's'"></span></div>
                <div class="flex justify-between"><span>Latency:</span> <span class="text-yellow-500" x-text="diagData.latency + 'ms'"></span></div>
                <div class="mt-2 space-y-1">
                    <div class="text-white/30 uppercase text-[9px]">Resolved Source Path:</div>
                    <div class="text-blue-400 text-[9px] break-all leading-tight bg-white/5 p-3 rounded-xl border border-white/5 border-dashed" x-text="diagData.src"></div>
                </div>
            </div>
        </div>

        <div class="mt-6 pt-6 border-t border-white/10 flex gap-4">
            <button @click="copyLogs()" class="flex-1 px-4 py-3 bg-white text-black hover:bg-red-600 hover:text-white rounded-2xl transition-all font-black uppercase text-[10px] tracking-widest flex items-center justify-center gap-2 shadow-xl">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                <span x-text="copyStatus"></span>
            </button>
            <button class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-[10px] uppercase font-black tracking-widest text-white/40">Reset</button>
        </div>
    </div>
    <!-- HUD COMPONENT END -->

    <script>
        function hubApp() {
            return {
                debugMode: true,
                copyStatus: 'Copy Logs',
                diagData: {
                    id: 'b2c9d1a3e5f7g8h9i0j1k2l3m4n5o6p7',
                    format: 'MP4 (H.264)',
                    res: '1920x1080',
                    network: 'IDLE (1)',
                    netCode: 1,
                    ready: 'ENOUGH_DATA (4)',
                    error: null,
                    buffer: 0,
                    duration: 320,
                    latency: 45,
                    src: 'X:/OKONAM/Agente/projects/videos engracados/TombosBrigasEIdiotices.mp4'
                },
                init() {
                    document.addEventListener('keydown', (e) => {
                        if (e.key.toLowerCase() === 'd') this.debugMode = !this.debugMode;
                    });
                },
                copyLogs() {
                    const logString = `[SPMH ENGINE TELEMETRY]\n` +
                                     `ID: ${this.diagData.id}\n` +
                                     `FORMAT: ${this.diagData.format} | RES: ${this.diagData.res}\n` +
                                     `NETWORK: ${this.diagData.network} | READY: ${this.diagData.ready}\n` +
                                     `ERROR: ${this.diagData.error || 'None'}\n` +
                                     `BUFFER: ${this.diagData.buffer}s/${this.diagData.duration}s\n` +
                                     `SOURCE: ${this.diagData.src}`;
                    
                    navigator.clipboard.writeText(logString).then(() => {
                        this.copyStatus = 'COPIED!';
                        setTimeout(() => { this.copyStatus = 'Copy Logs'; }, 2000);
                    });
                }
            }
        }
    </script>
</body>
</html>
