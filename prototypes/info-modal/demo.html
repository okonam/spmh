<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPMH Prototype | Info-Modal v3.1 (English)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0a0a0a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        [x-cloak] { display: none !important; }
        
        .glass-v3 { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .tech-label { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 2px; }
        .tech-value { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.8); }
    </style>
</head>
<body x-data="infoModal()" x-init="fetchRealData()">

    <!-- Trigger -->
    <button @click="openModal()" class="px-8 py-4 bg-white/5 border border-white/10 rounded-2xl font-black uppercase tracking-widest hover:bg-red-600 transition-all text-xs">Open File Information</button>

    <!-- Modal Overlay -->
    <div x-show="show" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm"
         x-cloak>
        
        <!-- Minimalist Card -->
        <div class="relative w-full max-w-2xl glass-v3 rounded-[40px] overflow-hidden flex flex-col shadow-2xl border border-white/5">
            
            <!-- Close Button -->
            <button @click="show = false" class="absolute top-6 right-6 z-50 p-2 bg-black/40 hover:bg-red-600 rounded-full transition-all text-white/40 hover:text-white border border-white/10 backdrop-blur-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Top Section: Random Video -->
            <div class="w-full h-72 relative bg-black">
                <video x-ref="modalVideo" autoplay muted loop playsinline 
                    :src="'http://localhost:8888/api/stream/' + videoId" 
                    class="w-full h-full object-cover opacity-70"
                    @loadedmetadata="$el.currentTime = Math.random() * ($el.duration * 0.8)"></video>
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-transparent to-transparent"></div>
            </div>

            <!-- Content Section -->
            <div class="p-10 space-y-10">
                
                <!-- Main Header -->
                <div class="space-y-2">
                    <h1 class="text-[48px] font-black uppercase tracking-tighter leading-none" x-text="videoData.title || 'Loading...'"></h1>
                    <div class="flex items-center gap-2 text-red-600 font-bold uppercase text-xs tracking-widest">
                        <span x-text="videoData.size || '--'"></span>
                        <span class="opacity-20 text-white">|</span>
                        <span>File Information</span>
                    </div>
                </div>

                <!-- Internal Info Grid -->
                <div class="grid grid-cols-2 gap-8 py-2 border-t border-white/5 pt-8">
                    <div>
                        <div class="tech-label">Asset ID</div>
                        <div class="tech-value text-[11px] font-mono opacity-50 truncate" x-text="videoId"></div>
                    </div>
                    <div>
                        <div class="tech-label">File Format</div>
                        <div class="tech-value" x-text="videoData.format || 'mp4'"></div>
                    </div>
                    <div>
                        <div class="tech-label">Resolution</div>
                        <div class="tech-value" x-text="videoData.resolution || '1920x1080'"></div>
                    </div>
                    <div>
                        <div class="tech-label">Directory Location</div>
                        <div class="tech-value text-[10px] opacity-40 leading-relaxed break-all" x-text="videoData.path || 'Fetching path...'"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-4 pt-4">
                    <button class="flex-1 px-8 py-5 bg-red-600 text-white rounded-2xl font-black uppercase tracking-widest hover:bg-red-700 transition-all shadow-xl">
                        Watch
                    </button>
                    <button class="px-8 py-5 bg-white/5 border border-white/10 rounded-2xl font-black uppercase tracking-widest hover:bg-white/10 transition-all">
                        Locate File
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        function infoModal() {
            return {
                show: false,
                videoId: '2db75058c64445f404d86657a5e2ef67',
                videoData: {},
                openModal() {
                    this.show = true;
                    this.$nextTick(() => {
                        const v = this.$refs.modalVideo;
                        if(v) v.currentTime = Math.random() * (v.duration * 0.8);
                    });
                },
                async fetchRealData() {
                    try {
                        const res = await fetch('http://localhost:8888/api/library');
                        const data = await res.json();
                        let found = null;
                        data.sections.forEach(s => {
                            const v = s.videos.find(vid => vid.id === this.videoId);
                            if (v) found = v;
                        });
                        if (found) this.videoData = found;
                    } catch (e) { console.error(e); }
                }
            }
        }
    </script>
</body>
</html>
