    <title>SPMH — Self Portable Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #0a0a0a; 
            color: white; 
            overflow-x: hidden;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 30px 30px;
        }
        [x-cloak] { display: none !important; }
        .netflix-gradient { background: linear-gradient(to top, #0a0a0a 0%, rgba(10,10,10,0) 50%, rgba(10,10,10,0.8) 100%); }
        .hero-mask { background: linear-gradient(to right, rgba(10,10,10,0) 30%, #0a0a0a 100%); }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #dc2626; cursor: pointer; }
    </style>
</head>

                    <div class="flex items-center gap-4 mb-6"><span class="bg-red-600 text-white text-[10px] font-black px-3 py-1 rounded uppercase tracking-widest">Featured Now</span><button @click="shuffleHero()" class="flex items-center gap-2 text-xs font-bold text-white/40 hover:text-white transition-colors group"><svg class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357-2H15"></path></svg>Shuffle Suggestions</button></div>
                    <h1 class="text-6xl md:text-9xl font-black mt-2 mb-10 drop-shadow-2xl line-clamp-2 leading-none tracking-tighter" x-text="vid.title"></h1>
                    <div class="flex flex-wrap gap-4"><button @click="playVideo(vid)" class="bg-white text-black px-12 py-5 rounded-2xl font-black flex items-center gap-4 hover:bg-gray-200 transition-all text-xl shadow-2xl"><svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY NOW</button><button @click="openDetails(vid)" class="bg-white/10 text-white px-12 py-5 rounded-2xl font-black flex items-center gap-4 hover:bg-white/20 transition-all backdrop-blur-xl text-xl border border-white/10"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> DETAILS</button></div>
                </div>
            </div>
        </template>
        <div class="absolute inset-y-0 left-0 flex items-center px-4 z-40"><button @click="heroIndex = (heroIndex - 1 + featuredList.length) % featuredList.length" class="p-4 rounded-full bg-black/20 hover:bg-black/50 backdrop-blur-md transition-all"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg></button></div>
        <div class="absolute inset-y-0 right-0 flex items-center px-4 z-40"><button @click="heroIndex = (heroIndex + 1) % featuredList.length" class="p-4 rounded-full bg-black/20 hover:bg-black/50 backdrop-blur-md transition-all"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg></button></div>
    </section>

    <!-- ── Video Lists ── -->
    <main class="relative z-10 pb-32 px-4 md:px-10 space-y-24" :class="searchQuery || showOnlyFavorites ? 'mt-32' : (featuredList.length > 0 ? '-mt-20' : 'mt-32')">
        <template x-for="section in filteredSections" :key="section.slug">
            <div class="space-y-6 fade-in">
                <div class="flex items-center gap-6 px-4">
                    <h2 class="text-3xl font-black tracking-tighter uppercase" x-text="section.name"></h2>
                    <div class="h-px flex-1 bg-white/10"></div>
                </div>
                <div class="flex overflow-x-auto gap-8 pb-10 px-4 no-scrollbar scroll-smooth">
                    <template x-for="vid in section.videos" :key="vid.id">
                        <div class="flex-none w-72 md:w-80 group relative">
                            <div class="aspect-video rounded-3xl overflow-hidden bg-[#141414] shadow-2xl transition-all duration-500 group-hover:scale-105 group-hover:z-30 cursor-pointer" @click="playVideo(vid)">
                                <img :src="'/api/thumb/' + vid.id" class="w-full h-full object-cover" loading="lazy">
                                <button @click.stop="toggleFavorite(vid.id)" class="absolute top-4 right-4 z-40 p-2 rounded-full backdrop-blur-md transition-all hover:scale-110" :class="isFavorite(vid.id) ? 'bg-red-600 text-white' : 'bg-black/40 text-white/40 hover:text-white'"><svg class="w-5 h-5" :fill="isFavorite(vid.id) ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                                <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-6"><button @click.stop="playVideo(vid)" class="bg-white text-black p-4 rounded-full hover:scale-110 transition-all shadow-2xl"><svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><button @click.stop="openDetails(vid)" class="bg-white/10 text-white p-4 rounded-full hover:scale-110 transition-all backdrop-blur-xl border border-white/20"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></button></div>
                            </div>
                            <h3 class="mt-4 font-bold text-gray-500 group-hover:text-white transition-colors px-4 text-sm line-clamp-1" x-text="vid.title"></h3>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="mt-20 border-t border-white/5 py-10 opacity-30 hover:opacity-100 transition-opacity">
        <div class="max-w-[1800px] mx-auto px-10 flex flex-col md:flex-row justify-between items-center gap-4 text-[10px] font-bold uppercase tracking-[0.2em]">
            <div class="flex items-center gap-4">
                <span>SPMH Version 1.4.0</span>
                <span class="w-1 h-1 bg-white/20 rounded-full"></span>
                <span>Project by <span class="text-red-600">Okonam</span></span>
            </div>
            <a href="https://github.com/okonam/spmh" target="_blank" class="flex items-center gap-2 hover:text-red-600 transition-colors">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                View on GitHub
            </a>
        </div>
    </footer>

    <!-- Player -->
    <div x-show="playing" class="fixed inset-0 z-[1000] bg-black group" x-cloak x-transition.opacity @contextmenu.prevent="showRightClickHint = true">
        <video x-ref="player" :src="currentVideo ? '/api/stream/' + currentVideo.id : ''" class="w-full h-full object-contain" @timeupdate="updateProgress()" @ended="closePlayer()"></video>
        
        <!-- Right Click Hint Modal (Fixed Z-INDEX) -->
        <div x-show="showRightClickHint" x-transition.opacity class="fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-6 text-center" @click="showRightClickHint = false">
            <div class="bg-white/10 backdrop-blur-3xl p-10 rounded-[40px] border border-white/20 max-w-sm space-y-6 shadow-2xl"><svg class="w-20 h-20 mx-auto text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg><h3 class="text-2xl font-black tracking-tighter uppercase">Premium Controls</h3><p class="text-white/60 text-sm">Right-click the player anytime to access subtitles, multi-audio tracks, and advanced playback settings.</p><button @click="showRightClickHint = false" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase text-xs">Close Tips</button></div>
        </div>

        <div class="absolute inset-0 z-[1010] flex flex-col justify-between opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
            <div class="p-6 md:p-10 flex justify-between items-center pointer-events-auto bg-gradient-to-b from-black/80 to-transparent">
                <button @click="closePlayer()" class="p-4 bg-white/5 hover:bg-white/20 rounded-full backdrop-blur-md transition-all"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg></button>
                <h2 class="text-lg md:text-2xl font-black uppercase tracking-widest line-clamp-1" x-text="currentVideo?.title"></h2>
                <div class="flex items-center gap-6 pointer-events-auto">
                    <!-- Volume Control -->
                    <div class="flex items-center gap-3 bg-white/5 px-6 py-3 rounded-2xl border border-white/10 group/volume">
                        <button @click="toggleMute()" class="text-white/60 hover:text-white transition-colors">
                            <template x-if="isMuted || volume == 0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg></template>
                            <template x-if="!isMuted && volume > 0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg></template>
                        </button>
                        <input type="range" min="0" max="1" step="0.01" x-model="volume" @input="updateVolume()" class="w-0 group-hover/volume:w-24 transition-all duration-500 h-1 bg-white/10 rounded-full appearance-none">
                    </div>
                    <button @click="setSpeed(playbackRate === 2 ? 1 : playbackRate + 0.5)" class="px-4 py-3 bg-white/5 rounded-2xl border border-white/10 text-[10px] md:text-xs font-black uppercase tracking-tighter">SPEED: <span x-text="playbackRate + 'x'"></span></button>
                </div>
            </div>
            <div class="flex items-center justify-center gap-8 md:gap-16 pointer-events-auto">
                <button @click="skip(-15)" class="p-4 md:p-6 bg-white/5 hover:bg-white/15 rounded-full transition-all hover:scale-110"><svg class="w-8 h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
                <button @click="togglePlay()" class="p-8 md:p-10 bg-white text-black rounded-full hover:scale-110 shadow-2xl transition-all"><template x-if="videoPaused"><svg class="w-12 h-12 md:w-16 md:h-16 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></template><template x-if="!videoPaused"><svg class="w-12 h-12 md:w-16 md:h-16 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></template></button>
                <button @click="skip(15)" class="p-4 md:p-6 bg-white/5 hover:bg-white/15 rounded-full transition-all hover:scale-110"><svg class="w-8 h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05 1 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg></button>
            </div>
            <div class="p-6 md:p-10 space-y-4 md:space-y-6 pointer-events-auto bg-gradient-to-t from-black/90 to-transparent"><div class="flex items-center justify-between text-[10px] font-black text-white/60 uppercase tracking-widest"><span x-text="formatTime(currentTime)"></span><span x-text="formatTime(duration)"></span></div><div class="relative h-2 bg-white/10 rounded-full cursor-pointer group/bar" @click="seek($event)"><div class="absolute inset-y-0 left-0 bg-red-600 rounded-full transition-all duration-100" :style="'width: ' + progress + '%'"></div></div></div>
        </div>
    </div>

    <script>
        function hubApp() {
            return {
                sections: [], featuredList: [], heroIndex: 0, detailVideo: null, currentVideo: null,
                scrolled: false, playing: false, showModal: false, showIntro: false, showShutdown: false, showRightClickHint: false,
                videoPaused: false, playbackRate: 1, progress: 0, currentTime: 0, duration: 0, searchQuery: '',
                favorites: JSON.parse(localStorage.getItem('spmh_favorites') || '[]'),
                showOnlyFavorites: false,
                volume: 1, isMuted: false, lastVolume: 1,

                async init() {
                    await this.fetchData();
                    setInterval(() => { if(!this.showModal && !this.playing && !this.searchQuery && !this.showOnlyFavorites) this.heroIndex = (this.heroIndex + 1) % this.featuredList.length; }, 10000);
                },

                get filteredSections() {
                    let results = this.sections;
                    if (this.showOnlyFavorites) results = results.map(s => ({...s, videos: s.videos.filter(v => this.isFavorite(v.id))})).filter(s => s.videos.length > 0);
                    if (this.searchQuery) {
                        const q = this.searchQuery.toLowerCase();
                        results = results.map(s => ({...s, videos: s.videos.filter(v => v.title.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))})).filter(s => s.videos.length > 0);
                    }
                    return results;
                },

                isFavorite(id) { return this.favorites.includes(id); },
                toggleFavorite(id) {
                    if (this.isFavorite(id)) this.favorites = this.favorites.filter(f => f !== id);
                    else this.favorites.push(id);
                    localStorage.setItem('spmh_favorites', JSON.stringify(this.favorites));
                },

                async fetchData() {
                    try {
                        const res = await fetch('/api/hub');
                        const data = await res.json();
                        this.sections = data.sections;
                        this.shuffleHero();
                    } catch (e) { console.error("Fetch Error:", e); }
                },

                shuffleHero() { const all = this.sections.flatMap(s => s.videos); if (all.length > 0) this.featuredList = all.sort(() => 0.5 - Math.random()).slice(0, 5); },
                openDetails(video) { this.detailVideo = video; this.showModal = true; },
                closeAll() { this.showModal = false; this.closePlayer(); this.showShutdown = false; this.showRightClickHint = false; },
                async playVideo(video) {
                    if(!video) return;
                    this.currentVideo = video; this.showIntro = true;
                    setTimeout(() => {
                        this.showIntro = false; this.playing = true; this.videoPaused = false; this.playbackRate = 1; this.showRightClickHint = false;
                        this.$nextTick(() => { 
                            this.$refs.player.src = '/api/stream/' + video.id; 
                            this.$refs.player.volume = this.volume;
                            this.$refs.player.play(); 
                        });
                    }, 1200);
                },
                async closePlayer() { if (this.$refs.player) { this.$refs.player.pause(); this.$refs.player.src = ""; } this.playing = false; this.currentVideo = null; },
                togglePlay() { if (this.$refs.player.paused) { this.$refs.player.play(); this.videoPaused = false; } else { this.$refs.player.pause(); this.videoPaused = true; } },
                updateProgress() { const p = this.$refs.player; if (p) { this.currentTime = p.currentTime; this.duration = p.duration; this.progress = (p.currentTime / p.duration) * 100; } },
                seek(e) { const bar = e.currentTarget; const rect = bar.getBoundingClientRect(); const pos = (e.clientX - rect.left) / rect.width; this.$refs.player.currentTime = pos * this.$refs.player.duration; },
                formatTime(sec) { if (isNaN(sec)) return "00:00"; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`; },
                skip(sec) { this.$refs.player.currentTime += sec; },
                setSpeed(rate) { this.playbackRate = rate; this.$refs.player.playbackRate = rate; },
                updateVolume() { this.$refs.player.volume = this.volume; if (this.volume > 0) this.isMuted = false; },
                toggleMute() { 
                    if (this.isMuted) { this.volume = this.lastVolume; this.isMuted = false; } 
                    else { this.lastVolume = this.volume; this.volume = 0; this.isMuted = true; }
                    this.$refs.player.volume = this.volume;
                },
                async openInExplorer(id) { if(id) await fetch(`/api/open/${id}`, { method: 'POST' }); },
                async confirmShutdown() { try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {} window.close(); }
            }
        }
    </script>
</body>
</html>
